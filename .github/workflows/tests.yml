name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No install step: the suite and everything it tests use only the standard
      # library (constitution Principle II). If a dependency ever creeps in, this
      # job fails at import rather than silently installing it.
      - name: Run tests
        run: python -m unittest discover -s tests -v
