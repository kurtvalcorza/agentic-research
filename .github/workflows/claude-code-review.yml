# Reviews pull requests automatically, without anyone having to ask.
#
# HOW THIS DIFFERS FROM claude.yml. That workflow is reactive: it wakes on an
# @claude mention and does whatever the comment asked. This one is unprompted —
# it reviews the diff the moment a pull request becomes reviewable. The two are
# complementary: the first review arrives without being requested, and every
# round after that is driven by @claude in a comment, which claude.yml handles.
#
# THE TWO MODES ARE NOT CONFIGURED THE SAME WAY, and assuming they were is what
# made the first version of this file useless. The action auto-detects its mode:
# an @claude comment gives TAG mode, setting `prompt` gives AGENT mode. Tag mode
# is handed a tool allowlist and `mcp__github_comment__update_claude_comment`,
# which is how claude.yml posts while holding only read `pull-requests`. Agent
# mode is handed NEITHER. This file previously ran in agent mode with no tools
# and read-only permission, so it could not fetch the diff and had nothing to
# post with: it exited after 3 turns and 14 seconds with one permission denial,
# posted nothing, and reported SUCCESS. See issue #13.
#
# So agent mode needs all three of these, and they are not independent:
#   1. `pull-requests: write` — it posts with `gh pr comment`, not the App token.
#   2. `--allowedTools` naming the posting and diff-reading tools explicitly.
#   3. A prompt that TELLS it to post, because review text returned as a message
#      is discarded — in agent mode there is no reviewer listening.
#
# REQUIRED SECRET: CLAUDE_CODE_OAUTH_TOKEN — the same repository secret
# claude.yml uses. See the comments there for how to generate it.
#
# NOTE ON THE FIRST RUN AFTER ANY CHANGE TO THIS FILE. The action refuses to act
# unless this file is byte-identical to the copy on the default branch, so the
# pull request that CHANGES it always goes green having done nothing, and says so
# in the log. A change here cannot be tested before it merges — only after.
name: Claude Code Review

on:
  pull_request:
    # No `synchronize`. Reviewing every push would re-review the same pull
    # request several times an hour and collide with the @claude round-trips of
    # the review loop. The unprompted review is the FIRST one; subsequent rounds
    # are requested explicitly by commenting @claude. Add `synchronize` here if
    # a review of every push is ever wanted.
    types: [opened, reopened, ready_for_review]

# One review per pull request, and cancel a review already in flight — a review
# of a superseded commit is worth nothing and should give up its runner. This is
# deliberately the opposite of claude.yml, which may be midway through pushing a
# commit and must not be killed. Safe at workflow level here because only
# `pull_request` events enter the group; claude.yml had to move its own onto the
# job because bot comment events were evicting real queued runs.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Drafts are work in progress by definition. `ready_for_review` above is the
    # trigger that catches them, once they stop being drafts.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      # write, NOT read: in agent mode the review is posted with `gh pr comment`
      # under GITHUB_TOKEN. Read-only here is the configuration that made this
      # workflow silently do nothing.
      pull-requests: write
      issues: read
      id-token: write
      actions: read   # lets the review read failing CI logs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: a review is a diff against the base branch, and a
          # shallow clone cannot produce one.
          fetch-depth: 0

      - name: Record the start time
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The branch is already checked out in the
            working directory with full history, so you can diff against the base
            directly as well as through `gh pr diff`.

            This repository is governed by .specify/memory/constitution.md and
            CLAUDE.md — read them. The rules that actually get broken here: stdlib
            only (no dependency may be added, including for tests), no imports
            across skills, fail closed (reject unknown keys, reject empty
            collections, report missing rather than defaulting to zero), and state
            what a check cannot verify whenever a check is added or changed.

            Weight these, in order:
              1. Fail-open behaviour — anything that accepts malformed input, or
                 reports success without having checked. A documented exit-2
                 contract that returns 0, or dies with a traceback, is a defect.
              2. Whether the diff does what its own comments claim it does.
              3. Test coverage of the specific behaviour changed, not in general.
              4. Constitution compliance as above.

            Verify by running the code wherever you can rather than reasoning
            about it — a static trace of this repository's checks has already been
            wrong about exit codes more than once. The suite is
            `python -m unittest discover -s tests`.

            POST YOUR FINDINGS. Use `gh pr comment` for the top-level review and
            mcp__github_inline_comment__create_inline_comment (with
            `confirmed: true`) for specific lines. Review text returned as a
            message is discarded unread — if you post nothing, nothing happened.
            Post the top-level comment even when you find no issues, saying so
            explicitly, so that silence is never ambiguous.

          # --allowedTools is REQUIRED in agent mode, which starts with none of
          # the tag-mode defaults. Without the `gh pr comment` grant the review
          # has no way to deliver anything it finds.
          claude_args: |
            --max-turns 150
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(python -m unittest:*),Bash(python3 -m unittest:*)"

      # The point of issue #13: a run that posts nothing must not report success.
      # A green check is a claim that a review happened, and this workflow made
      # that claim falsely on every pull request it saw. "Reviewed, found nothing"
      # has to be earned by an actual comment saying so.
      - name: Fail if the review posted nothing
        if: always() && steps.claude-review.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SINCE: ${{ steps.start.outputs.at }}
          PR: ${{ github.event.pull_request.number }}
          EXECUTED: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -euo pipefail
          # Count across ALL pages. The comments endpoints return 30 per page
          # oldest-first, so a single-page read sees the OLDEST 30 and misses the
          # comment this run just posted — on PR #3 the unpaginated call stops at
          # 2026-07-31T04:01Z while the newest is 2026-08-01T03:32Z, a full day
          # invisible. That would fail a review that genuinely happened, on
          # exactly the long iterative threads this repo produces.
          count () {
            gh api --paginate "$1" --jq "$2" | awk '{s += $1} END {print s + 0}'
          }

          # `execution_file` is set only when the action actually ran, so an empty
          # value means it never started. That has one BENIGN cause — a pull
          # request editing this very file, which the action refuses to run
          # because the copy under review is not yet byte-identical to the default
          # branch — and several malignant ones: an expired
          # CLAUDE_CODE_OAUTH_TOKEN, an API outage, a crash before outputs.
          #
          # Exempting all of them alike would mean a dead secret silently
          # downgrades every future review to a green warning nobody reads. That
          # is the same fail-open #13 was filed for, one level down. So the
          # exemption is scoped: benign only when this pull request actually
          # touches this workflow file.
          #
          # The #13 failure is exempt under neither test — it reached the model
          # and produced an execution file before giving up, so it still has to
          # answer for posting nothing.
          if [ -z "${EXECUTED}" ]; then
            # Derive this workflow's own path rather than hardcoding it. A string
            # literal here would go stale the moment the file is renamed, and it
            # would go stale on the ONE pull request that most needs the
            # exemption — the rename itself — reporting a phantom expired secret.
            # Config that silently stops matching itself is the failure class
            # this whole workflow exists to catch, so it should not ship one.
            # GITHUB_WORKFLOW_REF is `owner/repo/path/to/file.yml@refs/...`.
            me=$(printf '%s' "${GITHUB_WORKFLOW_REF}" | sed -E 's#^[^/]+/[^/]+/##; s#@.*$##')
            echo "this workflow is ${me}"
            self=$(count "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
                     "[.[] | select(.filename == \"${me}\")] | length")
            if [ "${self}" -gt 0 ]; then
              echo "::warning::The action did not execute because this pull" \
                   "request changes the review workflow itself, which it refuses" \
                   "to run until the change is on the default branch. Expected." \
                   "No review happened; this is not one."
              exit 0
            fi
            echo "::error::The action never executed, and this pull request does" \
                 "not touch the review workflow — so the usual benign cause does" \
                 "not apply. Check for an expired CLAUDE_CODE_OAUTH_TOKEN, an API" \
                 "outage, or a crash before outputs were written. Failing rather" \
                 "than reporting a review that did not happen (#13)."
            exit 1
          fi
          # Match on the authors this workflow can post as, not on "any comment
          # in the window": gemini-code-assist posts a notice on every pull
          # request opened, which would satisfy a naive count and hand back the
          # false green this guard exists to remove.
          #
          # If the posting identity ever changes, this guard fails rather than
          # passes. That is the intended direction — a false failure is visible
          # and takes one commit to fix, a false pass is the original bug.
          mine='["claude[bot]","github-actions[bot]"]'
          q="[.[] | select(.created_at > \"${SINCE}\") | select(.user.login as \$l | ${mine} | index(\$l))] | length"
          top=$(count "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" "$q")
          inline=$(count "repos/${GITHUB_REPOSITORY}/pulls/${PR}/comments" "$q")
          echo "posted since ${SINCE}: ${top} top-level, ${inline} inline"
          if [ "$((top + inline))" -eq 0 ]; then
            echo "::error::The review posted nothing. A green check here would" \
                 "claim a review happened when none did — see issue #13." \
                 "Check the run log above for a permission denial or turn cap."
            exit 1
          fi
